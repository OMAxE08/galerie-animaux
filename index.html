<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Galerie Animaux</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      text-align: center;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .item {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .item img {
      max-width: 100%;
      border-radius: 6px;
    }
    .download-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }
    .download-btn:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <h1>Galerie d'animaux</h1>
  <div class="gallery">
    <div class="item">
      <img src="images/chat.png" alt="Chat mignon">
      <a href="images/chat.png" download="chat.png" class="download-btn">Télécharger</a>
    </div>
    <div class="item">
      <img src="images/chien.png" alt="Chien joyeux">
      <a href="images/chien.png" download="chien.png" class="download-btn">Télécharger</a>
    </div>
    <div class="item">
      <img src="images/oiseau.png" alt="Oiseau coloré">
      <a href="images/oiseau.png" download="oiseau.png" class="download-btn">Télécharger</a>
    </div>
  </div>
</body>
</html>
